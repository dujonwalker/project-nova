services:
  obs-mcp:
    build:
      context: .
    container_name: obs-mcp
    restart: unless-stopped
    ports:
      - "${SSE_PORT:-3012}:${SSE_PORT:-3012}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - MCP_TRANSPORT=${MCP_TRANSPORT:-streamable-http}
      - SSE_HOST=${SSE_HOST:-0.0.0.0}
      - SSE_PORT=${SSE_PORT:-3012}
      - MCP_STATELESS_HTTP=${MCP_STATELESS_HTTP:-true}
      - MCP_JSON_RESPONSE=${MCP_JSON_RESPONSE:-false}
      - OBS_HOST=${OBS_HOST:-}
      - OBS_PORT=${OBS_PORT:-}
      - OBS_PASSWORD=${OBS_PASSWORD:-}
      - OBS_WEBSOCKET_URL=${OBS_WEBSOCKET_URL:-}
      - OBS_WEBSOCKET_PASSWORD=${OBS_WEBSOCKET_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${SSE_PORT:-3012}/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - mcp-network

networks:
  mcp-network:
    driver: bridge
