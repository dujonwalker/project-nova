services:
  searxng-mcp:
    image: isokoliuk/mcp-searxng:2.10.1
    container_name: searxng-mcp
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "${MCP_HTTP_PORT:-3023}:${MCP_HTTP_PORT:-3023}"
    environment:
      - SEARXNG_URL=${SEARXNG_URL:-http://127.0.0.1:8080}
      - MCP_HTTP_HOST=${MCP_HTTP_HOST:-0.0.0.0}
      - MCP_HTTP_PORT=${MCP_HTTP_PORT:-3023}
      - MCP_HTTP_STATELESS=${MCP_HTTP_STATELESS:-true}
      - MCP_HTTP_HARDEN=${MCP_HTTP_HARDEN:-false}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:'+(process.env.MCP_HTTP_PORT||3023)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - mcp-network

networks:
  mcp-network:
    driver: bridge
