services:
  cli-server-mcp:
    build:
      context: ..
    container_name: cli-server-mcp
    restart: unless-stopped
    privileged: true
    user: "${CLI_MCP_USER:-1000:1000}"
    group_add:
      - "${DOCKER_GID:-988}"
    ports:
      - "${SSE_PORT:-3009}:${SSE_PORT:-3009}"
    environment:
      - MCP_TRANSPORT=${MCP_TRANSPORT:-streamable-http}
      - SSE_HOST=${SSE_HOST:-0.0.0.0}
      - SSE_PORT=${SSE_PORT:-3009}
      - MCP_STATELESS_HTTP=${MCP_STATELESS_HTTP:-true}
      - MCP_SHELL_ALLOW_UNSAFE=${MCP_SHELL_ALLOW_UNSAFE:-1}
      - MCP_SHELL_SEC_CONFIG_FILE=${MCP_SHELL_SEC_CONFIG_FILE:-/etc/mcp-shell/security-unsafe.yaml}
      - MCP_SHELL_LOG_LEVEL=${MCP_SHELL_LOG_LEVEL:-info}
      - MCP_SHELL_LOG_FORMAT=${MCP_SHELL_LOG_FORMAT:-console}
      - MCP_SHELL_LOG_OUTPUT=${MCP_SHELL_LOG_OUTPUT:-stderr}
    volumes:
      - ${CLI_WORKSPACE_HOST_DIR:-/data/workspace}:/workspace:rw
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${SSE_PORT:-3009}/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - cli-server-mcp-network

networks:
  cli-server-mcp-network:
    driver: bridge
