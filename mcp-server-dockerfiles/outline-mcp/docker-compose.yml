services:
  outline-mcp:
    image: ghcr.io/vortiago/mcp-outline:1.11.0
    container_name: outline-mcp
    restart: unless-stopped
    ports:
      - "${SSE_PORT:-7070}:6060"
    environment:
      - OUTLINE_API_KEY=${OUTLINE_API_KEY}
      - OUTLINE_API_URL=${OUTLINE_API_URL:-http://127.0.0.1:3000/api}
      - MCP_TRANSPORT=streamable-http
      - MCP_HOST=0.0.0.0
      - MCP_PORT=6060
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6060/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - mcp-network

networks:
  mcp-network:
    driver: bridge
