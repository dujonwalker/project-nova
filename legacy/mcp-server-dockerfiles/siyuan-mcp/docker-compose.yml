services:
  siyuan-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: siyuan-mcp
    environment:
      - SIYUAN_TOKEN=${SIYUAN_TOKEN}
      - SIYUAN_SERVER=${SIYUAN_SERVER}
      - SIYUAN_URL=${SIYUAN_SERVER}
      - SSE_PORT=${SSE_PORT:-3003}
      - SSE_HOST=${SSE_HOST:-0.0.0.0}
    ports:
      - "${SSE_PORT:-3003}:${SSE_PORT:-3003}"
    restart: unless-stopped
